#################################### OPTIONS ###################################
# set-option -g default-shell /usr/local/bin/fish

tmux_dir="~/.config/tmux"
tmux_conf_dir="$tmux_dir/conf"
tmux_plugins_dir="$tmux_dir/plugins"

set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"

################################## CONF FILES ##################################
source "$tmux_conf_dir/opts.conf"
source "$tmux_conf_dir/keybind.conf"
# source "$tmux_conf_dir/skin.conf"

bind C-p display-popup -E "tms switch"
bind C-s display-popup -E "tms"

#################################### PLUGINS ###################################
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$tmux_plugins_dir"

set -g @plugin 'tmux-plugins/tpm'                   # Plugin Manager

set -g default-terminal "screen-256color"

# set -g default-terminal "rio"
# set-option -ga terminal-overrides ",rio:Tc"

set -s escape-time 0
set -g @plugin 'tmux-plugins/tmux-open'             # Open links from tmux - Select path and press o
set -g @plugin 'tmux-plugins/tmux-yank'             # Copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-sensible'         # Sensible defaults
set -g @plugin 'MunifTanjim/tmux-mode-indicator'    # Display current tmux mode
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # CPU and memory info


## Style 

# Style
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold] #S #[fg=${gray_light},nobold] | "
set -g status-right " #{cpu}   #{mem}  󱛟 #{disk -f}  󱊣 #{battery} "
# set -g status-right " #{cpu}   #{mem} "
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${green_soft}"

## Style

# set -g @plugin 'adibhanna/gruvbox-tmux'
# set -g @plugin "janoamaral/tokyo-night-tmux"
# set -g @plugin "adibhanna/gruvbox-tmux"

set -g @yank_with_mouse on                          # Just select with the mouse to copy

# set -g @tokyo-night-tmux_pane_id_style sub
# set -g @gruvbox-theme dark # dark or light
# set -g @tokyo-night-tmux_theme storm    # storm | day | default to 'night'
# set -g @tokyo-night-tmux_transparent 1  # 1 or 0

# set -g default-command /usr/local/bin/fish
# set -g default-shell /usr/local/bin/fish
set -g default-command "${SHELL}"

# Run the plugins
run "$tmux_plugins_dir/tpm/tpm"

